<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Exemples de composants carte responsive avec support du mode sombre et styles modernes."
    />
    <title>Cartes</title>
    <script>
      const theme =
        localStorage.getItem('theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
    </script>
    <!-- CSS -->
    <link rel="stylesheet" href="./css/main.css" />
    <!-- JS -->
    <script type="module" src="./js/main.js"></script>
  </head>
  <body class="page">
    <a href="#main-content" class="skip-link">Aller au contenu principal</a>

    <!-- Navbar-->
    <nav class="navbar" aria-label="Navigation principale">
      <div class="container">
        <div class="nav-wrapper">
          <!-- Bouton menu mobile -->
          <div class="nav-mobile-menu">
            <button
              type="button"
              aria-controls="mobile-menu"
              aria-expanded="false"
              class="mobile-menu-btn"
            >
              <span class="menu-btn-overlay"></span>
              <span class="sr-only">Ouvrir le menu principal</span>

              <!-- Icône hamburger -->
              <svg
                class="icon-hamburger"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M4 5h16" />
                <path d="M4 12h16" />
                <path d="M4 19h16" />
              </svg>

              <!-- Icône fermeture -->
              <svg
                class="icon-close"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
              </svg>
            </button>
          </div>

          <!-- Contenu de la navigation -->
          <div class="nav-content">
            <!-- Logo / Marque -->
            <div class="nav-brand">
              <a href="./index.html" class="brand-link">Mon Site Web</a>
            </div>

            <!-- Menu de navigation -->
            <div class="nav-menu">
              <ul class="nav-links" role="list">
                <li><a href="./index.html" class="nav-link">Accueil</a></li>
                <li>
                  <a href="./cards.html" aria-current="page" class="nav-link">Cartes</a>
                </li>
                <li><a href="./tables.html" class="nav-link">Tables</a></li>
              </ul>
            </div>
          </div>

          <div class="nav-actions">
            <!-- Bouton toggle dark/light mode -->
            <button type="button" class="theme-toggle" aria-label="Basculer le thème">
              <span class="menu-btn-overlay"></span>

              <!-- Icône lune (mode clair actif) -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                class="moon-icon"
              >
                <path
                  d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"
                />
              </svg>

              <!-- Icône soleil (mode sombre actif) -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                class="sun-icon"
              >
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2" />
                <path d="M12 20v2" />
                <path d="m4.93 4.93 1.41 1.41" />
                <path d="m17.66 17.66 1.41 1.41" />
                <path d="M2 12h2" />
                <path d="M20 12h2" />
                <path d="m6.34 17.66-1.41 1.41" />
                <path d="m19.07 4.93-1.41 1.41" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Menu de navigation mobile -->
      <div class="mobile-menu" id="mobile-menu" aria-label="Menu de navigation mobile">
        <ul class="mobile-menu-links" role="list">
          <li>
            <a href="./index.html" class="mobile-menu-link">Accueil</a>
          </li>
          <li>
            <a href="./cards.html" aria-current="page" class="mobile-menu-link">Cartes</a>
          </li>
          <li>
            <a href="./tables.html" class="mobile-menu-link">Tables</a>
          </li>
        </ul>
      </div>
    </nav>

    <main class="container" id="main-content">
      <article class="card">
        <header>
          <h3 class="card-title">Carte</h3>
          <p class="card-description">Carte description</p>
        </header>
      </article>
    </main>

    <!-- Pied de page -->
    <footer class="footer">
      <div class="footer-container">
        <p>&copy; <span class="year"></span> Mon Site Web. Tous droits réservés.</p>
      </div>
    </footer>
  </body>
</html>
